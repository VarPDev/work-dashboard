<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="What do I have to do now">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27272a"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
  </defs>
  <!-- A prioritised list: the top row is lit, the rest wait their turn. -->
  <rect width="32" height="32" rx="8" fill="url(#tile)"/>
  <rect x="7" y="7.6" width="18" height="3.6" rx="1.8" fill="#fbbf24"/>
  <rect x="7" y="14.2" width="13.5" height="3.6" rx="1.8" fill="#fafafa" opacity=".95"/>
  <rect x="7" y="20.8" width="9.5" height="3.6" rx="1.8" fill="#fafafa" opacity=".62"/>
</svg>
